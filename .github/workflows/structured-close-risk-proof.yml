name: Structured close-risk proof
on:
  push:
    branches: [ci/arc-cua-transfer-20261008]
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev,browser]'
      - name: Record environment and baseline
        run: |
          mkdir -p receipts
          git rev-parse HEAD | tee receipts/input-commit.txt
          python --version > receipts/environment.txt
          python -m pip freeze >> receipts/environment.txt
      - name: Require assertion-only baseline reproduction
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_structured_close_risk.py --junitxml=receipts/red.xml > receipts/red.txt 2>&1
          code=$?
          set -e
          cat receipts/red.txt
          test "$code" = 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ET.parse('receipts/red.xml').getroot().findall('testsuite')
          totals = {key: sum(int(s.get(key, 0)) for s in suites) for key in ('tests', 'failures', 'errors', 'skipped')}
          print(totals)
          assert totals == {'tests': 65, 'failures': 20, 'errors': 0, 'skipped': 0}, totals
          PY
      - name: Apply source-checked narrow fix
        run: python tools/apply_structured_close_risk.py
      - name: Run focused regressions
        run: python -m pytest -q tests/test_structured_close_risk.py tests/test_safety.py --junitxml=receipts/focused.xml | tee receipts/focused.txt
      - name: Run complete platform-available suite
        run: python -m pytest -q --junitxml=receipts/full.xml | tee receipts/full.txt
      - name: Lint new safety surface
        run: python -m ruff check src/arc_cua/safety.py tests/test_structured_close_risk.py | tee receipts/lint.txt
      - name: Publish tested source to this verification branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/ci/arc-cua-transfer-20261008
          git diff --check
          git diff > receipts/fix.patch
          git add src/arc_cua/safety.py src/arc_cua/runtime.py src/arc_cua/policies/choice.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(safety): honor structured close-control risk in both gates' -m 'Credit rymalia for diagnosis and element-based classification proposal in shhivv/arc-cua#5. Linux deterministic tests only; no native macOS certification.'
          git rev-parse HEAD | tee receipts/tested-commit.txt
          git ls-tree -r HEAD > receipts/tree.txt
          git archive --format=tar HEAD -o receipts/tested-source.tar
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/ci/arc-cua-transfer-20261008
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structured-close-risk-receipts
          path: receipts/
          retention-days: 14
