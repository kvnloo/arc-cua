name: Exact close-risk validation
on:
  push:
    branches: [ci/arc-cua-transfer-20261008]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  validate:
    name: ${{ matrix.os }} exact-source validation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 93ba21ba1d2dd3eb3c34775bdbefd3d53b631e84
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies for the actual platform
        run: |
          if [[ "$RUNNER_OS" = macOS ]]; then
            python -m pip install -e '.[dev,browser,macos]'
          else
            python -m pip install -e '.[dev,browser]'
          fi
      - name: Record and verify exact tested source
        run: |
          mkdir -p receipts
          test "$(git rev-parse HEAD)" = 93ba21ba1d2dd3eb3c34775bdbefd3d53b631e84
          git rev-parse HEAD | tee receipts/tested-commit.txt
          git ls-tree -r HEAD > receipts/tree.txt
          python --version > receipts/environment.txt
          uname -a >> receipts/environment.txt
          python -m pip freeze >> receipts/environment.txt
          git diff HEAD^ HEAD --check
      - name: Focused safety regressions (exit code enforced)
        run: python -m pytest -q tests/test_structured_close_risk.py tests/test_safety.py --junitxml=receipts/focused.xml | tee receipts/focused.txt
      - name: Full macOS unit suite (exit code enforced)
        if: runner.os == 'macOS'
        run: python -m pytest -q --junitxml=receipts/full.xml | tee receipts/full.txt
      - name: Linux full-suite baseline comparison (no silent skips)
        if: runner.os == 'Linux'
        run: |
          set +e
          python -m pytest -q --junitxml=receipts/full.xml > receipts/full.txt 2>&1
          code=$?
          set -e
          cat receipts/full.txt
          test "$code" = 1
          git worktree add --detach "$RUNNER_TEMP/arc-cua-baseline" 6b353039111c08c2c64c5229083606941e364eaf
          baseline="$RUNNER_TEMP/arc-cua-baseline"
          receipt_dir="$PWD/receipts"
          set +e
          (cd "$baseline" && PYTHONPATH="$baseline/src" python -m pytest -q --junitxml="$receipt_dir/baseline.xml") > receipts/baseline.txt 2>&1
          code=$?
          set -e
          cat receipts/baseline.txt
          test "$code" = 1
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          def results(name):
              root = ET.parse(f'receipts/{name}.xml').getroot()
              cases = root.findall('.//testcase')
              assert not root.findall('.//error')
              assert not root.findall('.//skipped')
              failures = {}
              for case in cases:
                  failure = case.find('failure')
                  if failure is not None:
                      text = ''.join(failure.itertext())
                      assert 'ModuleNotFoundError' in text
                      assert 'ApplicationServices' in text or 'AppKit' in text
                      failures[(case.get('classname'), case.get('name'))] = failure.get('message')
              return len(cases), failures
          old_count, old = results('baseline')
          new_count, new = results('full')
          assert old_count == 393 and new_count == 458, (old_count, new_count)
          assert len(old) == 8 and set(old) == set(new), (old, new)
          summary = {'baseline_passed': old_count - len(old), 'head_passed': new_count - len(new),
                     'unchanged_missing_macos_framework_failures': len(old), 'new_failures': 0,
                     'note': 'This is not a fully green Linux suite. Full failures retained in both reports.'}
          print(json.dumps(summary, indent=2))
          Path('receipts/linux-baseline-comparison.json').write_text(json.dumps(summary, indent=2))
          PY
      - name: Lint the new safety surface
        run: python -m ruff check src/arc_cua/safety.py tests/test_structured_close_risk.py | tee receipts/lint.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exact-close-risk-${{ runner.os }}
          path: receipts/
          retention-days: 14
